<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pause — оффлайн</title>
    <style>
      :root {
        --bg: #f7f5f0;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1816;
          --fg: #e8e5df;
          --muted: #a8a5a0;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Нет подключения</h1>
        <p>Открой приложение снова, когда появится сеть. Уже сохранённые сессии доступны после первого визита.</p>
      </div>
    </div>
  </body>
</html>
